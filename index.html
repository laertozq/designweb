<!DOCTYPE html>
<html lang="pt-br" x-data="{ tab: 'home', dark: true }" :data-theme="dark ? 'synthwave' : 'emerald'">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen font-sans transition-colors duration-300">

    <nav class="navbar bg-base-100 shadow-md px-4 sticky top-0 z-50">
        <div class="flex-1"><a class="btn btn-ghost text-xl">Dev.folio</a></div>
        <div class="flex-none">
            <button @click="tab = 'home'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='home'}">Home</button>
            <button @click="tab = 'sobre'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='sobre'}">Sobre</button>
            <button @click="tab = 'contato'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='contato'}">Contato</button>
            <input type="checkbox" class="toggle ml-4" x-model="dark" />
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div x-show="tab === 'home'" x-transition>
            <div class="hero min-h-[50vh] bg-base-200 rounded-box mt-4">
                <div class="hero-content text-center">
                    <div class="max-w-md">
                        <h1 class="text-5xl font-bold">Alpine SPA</h1>
                        <p class="py-6">Uma aplicação completa sem recarregar.</p>
                        <button @click="tab = 'contato'" class="btn btn-primary rounded-3xl">Fale Comigo</button>
                    </div>
                </div>
            </div>
        </div>

        <div x-show="tab === 'sobre'" x-transition x-data="{ ativo: 1 }" class="space-y-5">
            <div class="collapse collapse-arrow bg-base-300">
                <input type="radio" name="acc" @click="ativo = 1" checked />
                <div class="collapse-title text-2xl font-medium">Minha bagagem</div>
                <div class="collapse-content"><p>Desenvolvedor Front-end Junior</p></div>
            </div>
            <div class="collapse collapse-arrow bg-base-300">
                <input type="radio" name="acc" @click="ativo = 2" />
                <div class="collapse-title text-2xl font-medium ">Minha formação</div>
                <div class="collapse-content"><p>IFRN Zona-Norte - Informática para Internet.</p></div>
            </div>
        </div>

        <div x-show="tab === 'contato'" x-transition 
             x-data="{ email: '', msg: '', enviado: false }" class="max-w-md mx-auto mt-8 bg-base-200 p-6 ">
            
            <div class="form-control">
                <label class="label ">Email do destinatário</label>
                <input x-model="email" class="input input-bordered  rounded-3xl">
            </div>
            
            <div class="form-control mt-4">
                <label class="label">Mensagem</label>
                <textarea x-model="msg" class="textarea textarea-bordered  rounded-3xl"></textarea>
            </div>

            <div class="mt-6">
                <button @click="enviado = true; email=''; msg=''" 
                        :disabled="!email.includes('@') || msg.length < 1"
                        class="btn btn-primary w-full rounded-3xl">Enviar email</button>
            </div>

            <div x-show="enviado" x-transition class="alert alert-success mt-4 shadow-lg rounded-3xl">
                <span>Email enviado!</span>
            </div>
        </div>

    </main>
</body>
</html>
